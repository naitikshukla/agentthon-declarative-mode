agent_class: SequentialAgent
name: cluster_1_intelligence
description: Responsible for gathering all foundational market, competitor, and consumer data required for strategy.
instruction: |
  Execute the Intelligence Analyst to create the foundational strategy brief. The Market Scanner must run before the Insights Generator.
  First, identify market and competitor constraints using the Market Scanner.
  Second, use that context to generate the primary user personas and pain points via the Insights Generator.
  Pass the summarized 'Strategy Brief' (Target Persona, Top 3 Pain Points, Key Competitive Gap) to Cluster 2.
model: gemini-2.5-flash
sub_agents:
  - config_path: cluster1_agents/market_scanner.yaml
  - config_path: cluster1_agents/insights_generator.yaml