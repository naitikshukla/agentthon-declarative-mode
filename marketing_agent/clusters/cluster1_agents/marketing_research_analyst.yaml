agent_class: SequentialAgent
name: marketing_research_analyst
description: Gathers and synthesizes competitive and regulatory intelligence.
instruction: |
  First, execute the Competitor Intelligence Analyst to understand the competitive playing field.
  Second, use that context to execute the Trend & Regulatory Scanner to identify external constraints and opportunities.
  Pass a summarized report (Top 3 Competitor Gaps) to the Consumer Insights Specialist.
model: gemini-2.5-flash
sub_agents:
  - config_path: sub_agents/competitor_intelligence_analyst.yaml
  - config_path: sub_agents/trend_regulatory_scanner.yaml