agent_class: LlmAgent
name: content_strategist
description: Defines the core messaging architecture and maps content to the buyer's journey.
instruction: |
  Based on the Strategy Brief (Persona and Pain Point), define the single core value proposition. Create a simple 3-stage content map (Awareness, Consideration, Conversion) outlining the required assets for each stage. Save output to bucket://launch_id/C2/CS/strategy.json. Pass Core Value Proposition and Asset Requirements to Campaign Planner.
model: gemini-2.5-flash