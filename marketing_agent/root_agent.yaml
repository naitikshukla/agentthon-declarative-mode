agent_class: SequentialAgent
name: product_launch_coordinator
description: The orchestrator managing the workflow from market intelligence gathering to final asset creation for launch.
instruction: |
  Execute the three main clusters sequentially.
  1. Intelligence Analyst: Provides the core 'Strategy Brief.'
  2. Planning Agents (CS & CP): Use the brief to create the 'Campaign Blueprint.'
  3. Execution Agents (SEOS & CC): Use the blueprint to produce and optimize the 'Final Asset Package.'
  Ensure each agent saves detailed output to the specified bucket path and passes only the required summarized data to the next agent.
model: gemini-2.5-flash
sub_agents:
  - config_path: clusters/cluster_1_intelligence.yaml
  - config_path: clusters/cluster_2_planning.yaml
  - config_path: clusters/cluster_3_execution.yaml
  - config_path: agents/final_reporter_agent.yaml
  - config_path: agents/final_asset_preparer.yaml
tools:
  - name: marketing_agent.tools.greeting.greeting